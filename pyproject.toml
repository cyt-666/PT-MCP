[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-mcp"
version = "0.1.0"
description = "Standalone torrent site search and qBittorrent MCP service"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.28.1,<1",
    "lxml>=6.1.2,<7",
    "mcp==2.3.0",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "python-dateutil>=2.9.0.post0,<3",
    "PyYAML>=6.0.3,<7",
    "qbittorrent-api==2026.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pt_mcp = ["resources/profiles/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
